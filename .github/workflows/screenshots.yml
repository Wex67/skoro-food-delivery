# Создание скриншотов сайта для трёх размеров экрана.
name: Скриншоты сайта

on:
  push:
    branches: [main]
  # Возможность повторно запустить процесс вручную на вкладке Actions.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Телефон, планшет и компьютер
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Скачать файлы проекта
        uses: actions/checkout@v4

      - name: Подготовить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установить Playwright
        run: npm install --no-save --no-package-lock playwright@1.62.1

      - name: Установить браузер Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Создать скриншоты
        run: node scripts/screenshots.cjs

      - name: Сохранить скриншоты для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: skoro-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30
